<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FLUNERA AI — Скоро</title>

    <meta name="description"
          content="FLUNERA AI — интеллектуальная платформа для обучения, практики и развития. Скоро запуск.">

    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#090716">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at 20% 20%, rgba(108,92,231,.22), transparent 35%),
                radial-gradient(circle at 80% 70%, rgba(0,206,201,.14), transparent 35%),
                #090716;
            overflow: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .35;
        }

        .orb.one {
            width: 300px;
            height: 300px;
            background: #6c5ce7;
            top: -100px;
            left: -80px;
        }

        .orb.two {
            width: 280px;
            height: 280px;
            background: #00cec9;
            right: -100px;
            bottom: -100px;
        }

        .container {
            position: relative;
            z-index: 2;
            width: min(1000px, 92%);
            min-height: 100vh;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .card {
            width: 100%;
            padding: 65px 35px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 32px;
            background: rgba(255,255,255,.045);
            backdrop-filter: blur(25px);
            box-shadow:
                0 30px 100px rgba(0,0,0,.45),
                inset 0 1px 0 rgba(255,255,255,.05);
        }

        .logo {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 5px;
            color: #aaa3ff;
            margin-bottom: 28px;
        }

        h1 {
            font-size: clamp(52px, 9vw, 105px);
            line-height: .95;
            letter-spacing: -5px;
            margin-bottom: 25px;
            background: linear-gradient(90deg, #ffffff, #aaa3ff, #78e8e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            max-width: 650px;
            margin: 0 auto 42px;
            color: #aaa7bd;
            font-size: 18px;
            line-height: 1.6;
        }

        .quote {
            max-width: 650px;
            margin: 0 auto 45px;
            padding: 0 20px;
            color: #ddd9ed;
            font-size: 21px;
            line-height: 1.5;
            font-style: italic;
        }

        .quote::before {
            content: "“";
            font-size: 50px;
            color: #6c5ce7;
            vertical-align: -15px;
            margin-right: 5px;
        }

        .timer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 700px;
            margin: auto;
        }

        .time-box {
            padding: 24px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.08);
        }

        .number {
            display: block;
            font-size: clamp(30px, 5vw, 55px);
            font-weight: 800;
            letter-spacing: -2px;
        }

        .label {
            display: block;
            margin-top: 8px;
            color: #858198;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .status {
            margin-top: 35px;
            color: #77738b;
            font-size: 13px;
        }

        .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 8px;
            border-radius: 50%;
            background: #00cec9;
            box-shadow: 0 0 12px #00cec9;
        }

        @media (max-width: 650px) {
            .card {
                padding: 45px 18px;
                border-radius: 24px;
            }

            h1 {
                letter-spacing: -3px;
            }

            .subtitle {
                font-size: 16px;
            }

            .quote {
                font-size: 18px;
            }

            .timer {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
</div>

<main class="container">
    <section class="card">

        <div class="logo">FLUNERA AI</div>

        <h1>Скоро.</h1>

        <p class="subtitle">
            Мы готовим кое-что большое.
            FLUNERA AI уже близко.
        </p>

        <div class="quote">
            Будущее начинается с первого шага.
        </div>

        <div class="timer">

            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Дней</span>
            </div>

            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Часов</span>
            </div>

            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Минут</span>
            </div>

            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Секунд</span>
            </div>

        </div>

        <div class="status">
            <span class="dot"></span>
            FLUNERA AI готовится к запуску
        </div>

    </section>
</main>

<script>
    // 31 августа 2026, 20:00 по времени Ташкента (UTC+5)
    const releaseDate = new Date("2026-08-31T20:00:00+05:00");

    const days = document.getElementById("days");
    const hours = document.getElementById("hours");
    const minutes = document.getElementById("minutes");
    const seconds = document.getElementById("seconds");

    function updateCountdown() {
        const now = new Date();
        const difference = releaseDate.getTime() - now.getTime();

        if (difference <= 0) {
            days.textContent = "00";
            hours.textContent = "00";
            minutes.textContent = "00";
            seconds.textContent = "00";

            // После окончания отсчёта открываем регистрацию
            window.location.href = "/login.html";
            return;
        }

        const totalSeconds = Math.floor(difference / 1000);

        const d = Math.floor(totalSeconds / 86400);
        const h = Math.floor((totalSeconds % 86400) / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const s = totalSeconds % 60;

        days.textContent = String(d).padStart(2, "0");
        hours.textContent = String(h).padStart(2, "0");
        minutes.textContent = String(m).padStart(2, "0");
        seconds.textContent = String(s).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>

</body>
</html>
